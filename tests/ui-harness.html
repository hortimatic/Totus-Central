 if(!(e.target?.id||'').startsWith('homePrice'))return;
 const m=document.getElementById('homePriceMarginPct'),error=document.getElementById('homePriceError');
 try{
  const r=quickPriceStudy({cost:document.getElementById('homePriceCost')?.value,pvp:document.getElementById('homePricePvp')?.value,competitor:document.getElementById('homePriceCompetitor')?.value,discount:document.getElementById('homePriceDiscount')?.value,vat:21,re:5.2});
  if(m)m.textContent=r.marginPct.toFixed(1).replace('.',',')+' %';
  if(error){error.textContent='';error.hidden=true}
 }catch(e){
  if(m)m.textContent='—';
  if(error){error.textContent=e.message;error.hidden=false}
 }
});
