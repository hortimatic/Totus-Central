name: totus-prestashop-178-validation
services:
  mysql:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: test-only
      MYSQL_DATABASE: prestashop
      MYSQL_HOST: mysql
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 8s
      timeout: 5s
      retries: 18
  prestashop:
    image: prestashop/prestashop-flashlight:1.7.8.11
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PS_DOMAIN: localhost:8000
      MYSQL_EXTRA_DUMP: /tmp/ci-webservice.sql
      MYSQL_HOST: mysql
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    volumes:
      - ./bootstrap.sql:/tmp/ci-webservice.sql:ro
      - ../../prestashop/modules/totusproductbridge:/var/www/html/modules/totusproductbridge:ro
      - ./bridge-qa.php:/tmp/totus-bridge-qa.php:ro
    ports:
      - "127.0.0.1:8000:80"
