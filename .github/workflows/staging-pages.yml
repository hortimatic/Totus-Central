name: Totus Central Staging Pages (isolated)
on:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "index.html"
      - ".github/workflows/staging-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-central-pages
  cancel-in-progress: false
jobs:
  publish-staging:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
      - name: Checkout unchanged production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _prod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staged application syntax and logic
        run: |
          node --check src/app.js
          node --check src/pages/main.js
          node tests/qa.mjs
          node tests/functional-regression.mjs
          node tests/code-integrity.mjs
      - name: Install browser QA dependencies
        run: |
          npm install --no-save xlsx-js-style playwright jszip pdf-lib
          npx playwright install --with-deps chromium
      - name: Complete staged functionality QA
        run: |
          node tests/excel-qa.mjs
          node tests/quarter-fixture-qa.mjs
          python3 -m http.server 4173 >/tmp/totus-stage-pages.log 2>&1 &
          node tests/browser-qa.mjs
          node tests/layout-audit.mjs
          node tests/field-sweep-qa.mjs
          node tests/full-flow-qa.mjs
          node tests/backup-qa.mjs
      - name: Assemble production unchanged plus updated staging
        run: |
          mkdir -p _site/staging
          cp _prod/index.html _prod/favicon.svg _prod/fondo_original.png _site/
          cp -R _prod/src _site/src
          cp index.html favicon.svg fondo_original.png _site/staging/
          cp -R src _site/staging/src
          sed -i 's/<title>Totus Central<\/title>/<title>Totus Central - STAGING<\/title>/' _site/staging/index.html
          sed -i 's/<h1>Acceso<\/h1>/<h1>STAGING - entorno de pruebas<\/h1><p style="font-weight:700;color:#b45309">Base de datos de pruebas aislada y preparada. Necesitas un usuario propio de este entorno; no uses contraseñas de producción.<\/p>/' _site/staging/index.html
          test -f _site/staging/src/config.js
          grep -q 'documentBulkZip' _site/staging/src/pages/main.js
          grep -q 'importDocumentZip' _site/staging/src/app.js
          ! grep -q 'zwkpmjjuurgjygcrejiw' _site/staging/src/config.js
          node --check _site/staging/src/app.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
