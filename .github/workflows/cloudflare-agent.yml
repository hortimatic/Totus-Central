name: Cloudflare agent controls
on:
  push:
    branches: [feat/cloudflare-agent]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  cloud-agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/totus-ai/index.ts
      - run: node tests/cloudflare-engine-qa.mjs
      - run: node --test tests/codex-own-auth.mjs tests/assistant-attachments.mjs tests/assistant-operations.mjs
      - name: Disposable database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/cloudflare-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/040_cloudflare_agent.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/cloudflare-db-qa.sql
