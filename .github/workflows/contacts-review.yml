name: Revisar contactos y tareas
on:
  push:
    branches: [feat/contactos-configuracion-agentes, fix/chat-screen-fit, fix/chat-viewport-verification]
permissions:
  contents: read
jobs:
  shared-contacts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Shared contacts compatibility
        env:
          PGPASSWORD: test-only
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/shared-contacts-db-qa.sql
      - name: Tasks permissions and recovery
        if: always()
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h localhost -U postgres tasks_review
          for file in tests/chat-db-fixture.sql supabase/chat.sql supabase/tasks.sql tests/operational-permissions-db-qa.sql supabase/review_patches/041_task_removal.sql tests/task-removal-db-qa.sql; do
            if [ "$file" = "tests/chat-db-fixture.sql" ]; then sed 's/create role anon;create role authenticated;create role service_role;/create role service_role;/' "$file" | psql -h localhost -U postgres -d tasks_review -v ON_ERROR_STOP=1; else psql -h localhost -U postgres -d tasks_review -v ON_ERROR_STOP=1 -f "$file"; fi
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.56.1 pdf-lib@1.17.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/totus.log 2>&1 &
      - run: node --test tests/cloudflare-tools-qa.mjs
      - run: node tests/cloudflare-engine-qa.mjs
      - run: node tests/team-chat-browser-qa.mjs
      - run: node tests/chat-shell-fit-browser-qa.mjs
      - name: Chat interaction regressions
        run: |
          for file in tests/chat-reference-layout-qa.mjs tests/chat-navigation-browser-qa.mjs tests/chat-workspace-browser-qa.mjs tests/chat-usability-browser-qa.mjs tests/chat-integral-browser-qa.mjs tests/chat-mobile-reading-browser-qa.mjs tests/chat-buzz-browser-qa.mjs tests/chat-alerts-browser-qa.mjs tests/chat-auto-read-browser-qa.mjs; do
            node "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-screen-fit
          path: artifacts/chat-fit/
      - run: node tests/contacts-settings-browser-qa.mjs
      - run: node tests/tasks-browser-qa.mjs
