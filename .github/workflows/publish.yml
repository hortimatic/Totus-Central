name: Publicar Totus Central
on:
  push:
    branches: [totus-central]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-central-pages
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/qa.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assemble production with no second application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,shutil
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']
          root=Path('_site')
          root.mkdir()
          for name in ['index.html','favicon.svg','fondo_original.png']:
              shutil.copyfile(name,root/name)
          shutil.copytree('src',root/'src')
          shutil.copytree('assets',root/'assets')
          html=(root/'index.html').read_text()
          assert 'ENTORNO DE PRUEBAS' not in html and "build.environment!=='production'" in html
          html=html.replace('href="src/appearance.css"',f'href="src/appearance.css?v={sha}"')
          html=html.replace('href="src/interface-design.css"',f'href="src/interface-design.css?v={sha}"')
          html=html.replace('href="src/stitch-design.css"',f'href="src/stitch-design.css?v={sha}"')
          html=html.replace('href="src/prestashop.css"',f'href="src/prestashop.css?v={sha}"')
          html=html.replace('href="src/productos.css"',f'href="src/productos.css?v={sha}"')
          html=html.replace('href="src/tasks.css"',f'href="src/tasks.css?v={sha}"')
          html=html.replace('href="src/team-chat.css"',f'href="src/team-chat.css?v={sha}"')
          html=html.replace('href="src/styles.css"',f'href="src/styles.css?v={sha}"').replace('src="src/bootstrap.js"',f'src="src/bootstrap.js?v={sha}"')
          (root/'index.html').write_text(html)
          pattern=re.compile(r"""(\bfrom\s*['"])(\.[^'"]+\.(?:m?js))(['"])""")
          dynamic_pattern=re.compile(r"""(\bimport\s*\(\s*['"])(\.[^'"]+\.(?:m?js))(['"])""")
          version=lambda m:f'{m.group(1)}{m.group(2)}?v={sha}{m.group(3)}'
          for file in (root/'src').rglob('*.js'):
              source=pattern.sub(version,file.read_text())
              file.write_text(dynamic_pattern.sub(version,source))
          css_import=re.compile(r"""(@import\s+url\(\s*['"])(\.[^'"]+\.css)(['"])""")
          for file in (root/'src').rglob('*.css'):
              file.write_text(css_import.sub(version,file.read_text()))
          config=(root/'src/config.js').read_text()
          assert 'awmojepsasikxocoeqtu.supabase.co' in config and 'zwkpmjjuurgjygcrejiw' not in config
          (root/'build-info.json').write_text(json.dumps({'environment':'production','commit':sha},separators=(',',':'))+'\n')
          legacy=root/'staging'
          legacy.mkdir()
          (legacy/'index.html').write_text('''<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Totus Central</title><link rel="canonical" href="https://hortimatic.github.io/Totus-Central/"><meta http-equiv="refresh" content="0;url=../"><script>location.replace('../'+location.search+location.hash)</script><p>Totus Central tiene una única dirección. <a href="../">Abrir Totus Central</a></p></html>''')
          (root/'.nojekyll').touch()
          assert not (legacy/'src').exists()
          assert not (root/'supabase').exists() and not (root/'tests').exists()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait until the exact deployment artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url=f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}/artifacts?per_page=100'
          for attempt in range(12):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: artifacts=json.load(response)['artifacts']
              matches=[a for a in artifacts if a['name']==os.environ['ARTIFACT_NAME'] and not a['expired']]
              if len(matches)==1:
                  print('Exact deployment artifact is ready');break
              if len(matches)>1: raise SystemExit('Duplicate deployment artifacts; refusing ambiguous publication')
              time.sleep(3)
          else: raise SystemExit('Deployment artifact did not become visible')
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published production commit
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body="$(curl --location --fail --silent --show-error --max-time 15 "${PAGES_BASE%/}/build-info.json?run=$GITHUB_RUN_ID" || true)"
            html="$(curl --location --fail --silent --show-error --max-time 15 "${PAGES_BASE%/}/?run=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\":\"$GITHUB_SHA\"" && printf '%s' "$html" | grep -Fq "src/bootstrap.js?v=$GITHUB_SHA"; then exit 0; fi
            sleep 5
          done
          echo 'Production commit was not visible after deployment' >&2
          exit 1
