name: Entrega completa Totus Central
on:
  push:
    branches:
      - totus-central-final-2026-10-13
permissions:
  contents: read
jobs:
  entregar-codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ZIP del codigo completo
        run: |
          git archive --format=zip --output=Totus_Central_FINAL_2026-10-13.zip HEAD
          unzip -t Totus_Central_FINAL_2026-10-13.zip
          sha256sum Totus_Central_FINAL_2026-10-13.zip > Totus_Central_FINAL_2026-10-13.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: totus-central-codigo-final
          path: |
            Totus_Central_FINAL_2026-10-13.zip
            Totus_Central_FINAL_2026-10-13.sha256
          retention-days: 7
