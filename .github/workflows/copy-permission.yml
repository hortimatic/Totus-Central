name: Copy server permissions
on:
  pull_request:
    branches: [totus-central]
  workflow_dispatch:
jobs:
  copy-server-permission:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce denial, repair and verify isolated server access
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/copy-server-permission-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261114121001_copy_server_registry_permission.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/copy-server-permission-qa.sql
