name: Totus Clean QA

on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-v6

concurrency:
  group: totus-clean-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate clean architecture
        run: node tests/ui-smoke.mjs
