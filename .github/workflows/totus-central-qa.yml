name: Totus Central QA
# qa-revision: 18

on:
  workflow_dispatch:

concurrency:
  group: totus-central-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright xlsx-js-style jszip
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/totus-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/totus-http.log
          exit 1
      - name: Run UI smoke test
        run: node tests/ui-smoke.mjs
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totus-visual-qa
          path: qa-screenshots
          if-no-files-found: ignore
          retention-days: 3
