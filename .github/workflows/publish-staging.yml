name: Publicar staging sin modificar main
on:
  push:
    branches: [staging]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-central-pages
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - name: Obtain immutable production source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
          persist-credentials: false
      - name: Obtain exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: staging-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify distinct and correct databases
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'zwkpmjjuurgjygcrejiw.supabase.co' production-source/src/config.js
          grep -Fq 'awmojepsasikxocoeqtu.supabase.co' staging-source/src/config.js
          if grep -Fq 'zwkpmjjuurgjygcrejiw.supabase.co' staging-source/src/config.js; then
            echo 'ERROR: staging points at production' >&2; exit 1
          fi
          if grep -Fq 'awmojepsasikxocoeqtu.supabase.co' production-source/src/config.js; then
            echo 'ERROR: main points at staging' >&2; exit 1
          fi
      - name: Check staging structure, permissions and calculations
        working-directory: staging-source
        run: |
          node tests/qa.mjs
          node tests/closed-closing-qa.mjs
          node tests/partial-balances-qa.mjs
          node tests/team-admin-qa.mjs
          node tests/invoice-issuer-qa.mjs
          node tests/gestor-source-qa.mjs
          node tests/functional-regression.mjs
          node tests/cross-view-integrity-qa.mjs
          node tests/code-integrity.mjs
          node tests/permissions-qa.mjs
          node tests/roles-and-help-qa.mjs
          node tests/route-smoke.mjs
          node tests/action-inventory-qa.mjs
          node tests/api-integrity-qa.mjs
          node tests/filters-qa.mjs
           node tests/document-archive-qa.mjs
          node tests/expense-archive-qa.mjs
          node tests/excel-invariants.mjs
      - name: Install browser and document testing dependencies
        working-directory: staging-source
        run: |
          npm install --no-save xlsx-js-style playwright jszip pdf-lib
          npx playwright install --with-deps chromium
      - name: Check exports and real browser flows against isolated mock data
        working-directory: staging-source
        run: |
          node tests/excel-qa.mjs
          node tests/gestor-workbook-qa.mjs
          node tests/gestor-print-qa.mjs
          node tests/quarter-fixture-qa.mjs
          node tests/annual-stress-qa.mjs
          python3 -m http.server 4173 >/tmp/totus-staging-qa-http.log 2>&1 &
          node tests/browser-qa.mjs
          node tests/layout-audit.mjs
          node tests/visual-geometry-qa.mjs
          node tests/user-screenshot-qa.mjs
          node tests/modal-geometry-qa.mjs
          node tests/field-sweep-qa.mjs
          node tests/full-flow-qa.mjs
          node tests/invoice-logo-qa.mjs
          node tests/deletion-flows-qa.mjs
          node tests/backup-qa.mjs
          node tests/admin-submenus-qa.mjs
          node tests/billing-submenus-qa.mjs
          node tests/fiscal-submenus-qa.mjs
          node tests/store-drawers-qa.mjs
          node tests/mobile-navigation-qa.mjs
          node tests/shell-geometry-qa.mjs
          node tests/subtab-walk-qa.mjs
          node tests/storage-live-qa.mjs
      - name: Assemble single GitHub Pages site with untouched main and /staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/staging
          for file in index.html favicon.svg fondo_original.png; do
            cp "production-source/$file" "_site/$file"
            cp "staging-source/$file" "_site/staging/$file"
            cmp "production-source/$file" "_site/$file"
            cmp "staging-source/$file" "_site/staging/$file"
          done
          cp -R production-source/src _site/src
          cp -R staging-source/src _site/staging/src
          diff -qr production-source/src _site/src
          diff -qr staging-source/src _site/staging/src
          # Cache-bust published staging imports and CSS without altering main or source files.
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']
          root=Path('_site/staging')
          index=root/'index.html'
          html=index.read_text()
          assert 'href="src/styles.css"' in html and 'src="src/app.js"' in html
          html=html.replace('href="src/styles.css"',f'href="src/styles.css?v={sha}"')
          html=html.replace('src="src/app.js"',f'src="src/app.js?v={sha}"')
          index.write_text(html)
          pattern=re.compile(r"""(\bfrom\s*['"])(\.[^'"]+\.js)(['"])""")
          for file in (root/'src').rglob('*.js'):
              original=file.read_text()
              content=pattern.sub(lambda m:f'{m.group(1)}{m.group(2)}?v={sha}{m.group(3)}',original)
              file.write_text(content)
          PY
          grep -Fq "src/app.js?v=$GITHUB_SHA" _site/staging/index.html
          grep -Fq "src/styles.css?v=$GITHUB_SHA" _site/staging/index.html
          grep -Fq "./config.js?v=$GITHUB_SHA" _site/staging/src/app.js
          # Sello de la versión publicada SOLO en /staging; main queda idéntico.
          printf '{"environment":"staging","commit":"%s"}\n' "$GITHUB_SHA" > _site/staging/build-info.json
          grep -Fq "$GITHUB_SHA" _site/staging/build-info.json
          test ! -e _site/build-info.json
          touch _site/.nojekyll
          test -f _site/staging/src/app.js
          test ! -e _site/supabase
          test ! -e _site/staging/supabase
          test ! -e _site/staging/tests
          printf 'main %s | staging %s\n' "$(git -C production-source rev-parse HEAD)" "$(git -C staging-source rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify original staging URL displays this commit
        shell: bash
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${PAGES_BASE%/}/staging/build-info.json"
          echo "Checking the original staging publication: $url"
          for attempt in {1..12}; do
            body="$(curl --location --fail --silent --show-error --max-time 15 "$url?run=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$body" | grep -Fq "\"commit\":\"$GITHUB_SHA\""; then
              echo "Verified: the original /staging/ path serves Git commit $GITHUB_SHA."
              exit 0
            fi
            echo "Deployment not visible yet (attempt $attempt/12)."
            sleep 5
          done
          echo "ERROR: The original staging URL does not serve this commit." >&2
          exit 1
