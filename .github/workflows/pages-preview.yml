name: Totus Central Production Pages (QA gated)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-central-pages
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify core code
        run: |
          node tests/qa.mjs
          node tests/functional-regression.mjs
          node tests/code-integrity.mjs
      - name: Install QA browser and document dependencies
        run: |
          npm install --no-save xlsx-js-style playwright jszip pdf-lib
          npx playwright install --with-deps chromium
      - name: Full QA before publishing
        run: |
          node tests/excel-qa.mjs
          node tests/quarter-fixture-qa.mjs
          python3 -m http.server 4173 >/tmp/totus-pages-preview.log 2>&1 &
          node tests/browser-qa.mjs
          node tests/layout-audit.mjs
          node tests/field-sweep-qa.mjs
          node tests/full-flow-qa.mjs
          node tests/backup-qa.mjs
      - name: Checkout isolated staging source
        uses: actions/checkout@v4
        with:
          ref: staging
          path: _staging_source
      - name: Package ONLY static app assets
        run: |
          mkdir -p _site
          cp index.html favicon.svg fondo_original.png _site/
          cp -R src _site/src
          test -f _site/src/app.js
          test -f _site/src/api.js
          test ! -d _site/supabase
          test ! -d _site/tests
          mkdir -p _site/staging
          cp _staging_source/index.html _staging_source/favicon.svg _staging_source/fondo_original.png _site/staging/
          cp -R _staging_source/src _site/staging/src
          sed -i 's/<title>Totus Central<\/title>/<title>Totus Central - STAGING<\/title>/' _site/staging/index.html
          sed -i 's/<h1>Acceso<\/h1>/<h1>STAGING - entorno de pruebas<\/h1><p style="font-weight:700;color:#b45309">Base de datos de pruebas aislada y preparada. Necesitas un usuario propio de este entorno; no uses contraseñas de producción.<\/p>/' _site/staging/index.html
          test -f _site/staging/src/config.js
          grep -q 'stagingSignupBtn' _site/staging/index.html
          grep -q 'documentBulkZip' _site/staging/src/pages/main.js
          grep -q "'docx'" _site/staging/src/file-utils.js
          grep -q 'importDocumentZip' _site/staging/src/app.js
          node --check _site/staging/src/app.js
          node --check _site/staging/src/pages/main.js
          grep -q 'profiles.data' _site/staging/src/app.js
          ! grep -q 'zwkpmjjuurgjygcrejiw' _site/staging/src/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
