name: Totus Central Pages (manual, QA gated)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: totus-central-pages
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/auditoria-regresion-2026-10-13'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify core code
        run: |
          node tests/qa.mjs
          node tests/functional-regression.mjs
          node tests/code-integrity.mjs
      - name: Install QA browser and document dependencies
        run: |
          npm install --no-save xlsx-js-style playwright jszip pdf-lib
          npx playwright install --with-deps chromium
      - name: Full QA before publishing
        run: |
          node tests/excel-qa.mjs
          node tests/quarter-fixture-qa.mjs
          python3 -m http.server 4173 >/tmp/totus-pages-preview.log 2>&1 &
          node tests/browser-qa.mjs
          node tests/layout-audit.mjs
          node tests/field-sweep-qa.mjs
          node tests/full-flow-qa.mjs
          node tests/backup-qa.mjs
      - name: Package ONLY static app assets
        run: |
          mkdir -p _site
          cp index.html favicon.svg fondo_original.png _site/
          cp -R src _site/src
          test -f _site/src/app.js
          test -f _site/src/api.js
          test ! -d _site/supabase
          test ! -d _site/tests
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
