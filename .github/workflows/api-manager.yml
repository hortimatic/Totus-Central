name: Revisar gestor de APIs
on:
  workflow_call:
  push:
    branches: [feat/api-manager, feat/ai-documents-reports, fix/api-response-validation, fix/api-chat-workflow, fix/ai-conversation-continuity, fix/user-purge-reader-clarity]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify private connection lifecycle
        env:
          PGPASSWORD: test-only
        run: |
          for file in tests/cloudflare-db-fixture.sql supabase/review_patches/040_cloudflare_agent.sql supabase/review_patches/044_api_connections.sql tests/api-manager-db-qa.sql supabase/review_patches/045_api_agent_selection.sql supabase/review_patches/046_api_technical_users.sql tests/api-selection-db-qa.sql supabase/review_patches/047_api_verification_failure.sql tests/api-verification-failure-db-qa.sql supabase/review_patches/048_api_identity_validation.sql tests/api-identity-validation-db-qa.sql supabase/review_patches/050_api_actor_readiness.sql supabase/review_patches/049_api_chat_routing.sql tests/api-chat-routing-db-qa.sql supabase/review_patches/051_ai_access_and_direct_target.sql tests/user-retirement-fixture.sql supabase/review_patches/052_retire_users_preserve_history.sql tests/user-retirement-db-qa.sql supabase/review_patches/053_configurable_api_limits.sql tests/api-configurable-limits-db-qa.sql tests/user-purge-fixture.sql supabase/review_patches/054_user_account_purge.sql tests/user-purge-db-qa.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Preserve the current Cloudflare configuration and counters
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h localhost -U postgres api_legacy
          sed 's/create role anon;create role authenticated;create role service_role;//' tests/chat-db-fixture.sql > /tmp/api-chat-fixture.sql
          sed 's|\\i tests/chat-db-fixture.sql|\\i /tmp/api-chat-fixture.sql|' tests/cloudflare-db-fixture.sql | psql -h localhost -U postgres -d api_legacy -v ON_ERROR_STOP=1
          for file in supabase/review_patches/040_cloudflare_agent.sql supabase/review_patches/044_api_connections.sql tests/api-legacy-import-db-qa.sql; do
            psql -h localhost -U postgres -d api_legacy -v ON_ERROR_STOP=1 -f "$file"
          done
  interface-and-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/totus-connections/index.ts supabase/functions/totus-ai/index.ts supabase/functions/team-admin/index.ts
      - run: npm install --no-save --no-package-lock xlsx-js-style@1.2.0
      - run: node --test tests/agent-conversation-qa.mjs tests/agent-workbooks-qa.mjs tests/cloudflare-tools-qa.mjs tests/api-transport-qa.mjs tests/api-provider-qa.mjs tests/api-service-qa.mjs tests/agent-delivery-qa.mjs tests/github-connection-qa.mjs tests/ai-file-response-qa.mjs tests/user-retirement-qa.mjs tests/user-purge-qa.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/totus-api.log 2>&1 &
      - run: node tests/user-purge-browser-qa.mjs
      - run: node tests/api-manager-browser-qa.mjs
      - run: node tests/field-help-interaction-qa.mjs
      - run: node tests/team-chat-qa.mjs
      - run: node tests/subtab-walk-qa.mjs
      - run: node tests/api-settings-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-manager-layout
          path: |
            artifacts/api-manager/
            artifacts/user-purge/
