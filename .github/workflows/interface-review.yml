name: Revisar diseño de interfaz
on:
  push:
    branches: [design/stitch-interface, fix/interface-publication, fix/navigation-breakpoint-wait, fix/login-and-navigation-finish, feat/stitch-complete, feat/navigation-account-ai-plan, feat/personal-workspace]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.56.1 xlsx-js-style@1.2.0 jszip@3.10.1 pdf-lib@1.17.1 fflate@0.8.3
      - run: npx playwright install --with-deps chromium
      - run: node tests/interface-design-qa.mjs
      - run: node tests/drawer-sales-qa.mjs
      - run: node tests/appearance-qa.mjs
      - run: node tests/appearance-tools-qa.mjs
      - run: node tests/personal-interface-qa.mjs
      - run: node tests/action-inventory-qa.mjs
      - name: Servir simulación sin datos reales
        run: python3 -m http.server 4173 >/tmp/totus-interface.log 2>&1 &
      - run: node tests/session-startup-browser-qa.mjs
      - run: node tests/module-navigation-browser-qa.mjs
      - run: node tests/ai-connection-test-browser-qa.mjs
      - run: node tests/chat-reference-layout-qa.mjs
      - run: node tests/chat-navigation-browser-qa.mjs
      - run: node tests/chat-workspace-browser-qa.mjs
      - run: node tests/appearance-tools-browser-qa.mjs
      - run: node tests/account-workspace-browser-qa.mjs
      - run: node tests/stitch-design-browser-qa.mjs
      - name: Comprobar los recorridos finales pendientes
        run: |
          failed=0
          for file in tests/report-period-qa.mjs tests/second-review-qa.mjs tests/rectifying-browser-qa.mjs tests/pdf-preview-qa.mjs tests/invoice-logo-qa.mjs tests/backup-qa.mjs tests/recovery-browser-qa.mjs tests/form-drafts-qa.mjs tests/attachment-integrity-qa.mjs tests/admin-submenus-qa.mjs tests/billing-submenus-qa.mjs tests/fiscal-submenus-qa.mjs tests/store-drawers-qa.mjs tests/mobile-navigation-qa.mjs tests/shell-geometry-qa.mjs tests/subtab-walk-qa.mjs; do
            if ! node "$file"; then failed=1; fi
          done
          exit "$failed"
      - run: node tests/personal-layout-sweep-browser-qa.mjs
      - run: node tests/module-navigation-browser-qa.mjs
      - run: node tests/interface-design-browser-qa.mjs
      - run: node tests/drawer-sales-browser-qa.mjs
      - run: node tests/mobile-navigation-qa.mjs
      - run: node tests/shell-geometry-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totus-interface-review
          path: |
            artifacts/appearance-tools/
            artifacts/account-workspace/
            artifacts/interface-design/
            artifacts/stitch-complete/
            artifacts/layout_shell_*.png
            artifacts/shell-geometry.json
  drawer-sales-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar ventas por caja en base desechable
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/closing-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261019120841_preserve_closing_income_selection_on_reconciliation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/020_closing_drafts_and_drawer_checks.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/035_drawer_sales_references.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/035_drawer_sales_references.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/closing-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/drawer-sales-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/account-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/034_personal_account.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/account-db-qa.sql
  drawer-sales-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar referencia por caja y copia antigua en base desechable
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/stock-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023170949_stock_receipts_with_complete_backups.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023175147_bounded_backup_rehearsal_timeout.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/chat-recovery-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/chat.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/chat-recovery.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/chat-recovery-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tasks.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tasks-recovery.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/tasks-recovery-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/drawer-sales-recovery-qa.sql

  personal-account-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify personal profiles in disposable database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/account-workspace-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/034_personal_account.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/038_personal_workspace.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/account-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/account-workspace-db-qa.sql
