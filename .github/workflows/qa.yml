name: Totus Clean QA
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/qa.mjs
      - run: node tests/functional-regression.mjs
      - run: node tests/code-integrity.mjs
      - run: node tests/route-smoke.mjs
      - run: npm install --no-save xlsx-js-style playwright jszip pdf-lib
      - run: npx playwright install --with-deps chromium
      - run: node tests/excel-qa.mjs
      - run: node tests/quarter-fixture-qa.mjs
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/totus-http.log 2>&1 &
      - run: node tests/browser-qa.mjs
      - run: node tests/layout-audit.mjs
      - run: node tests/field-sweep-qa.mjs
      - run: node tests/full-flow-qa.mjs
      - run: node tests/backup-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: totus-excel-qa
          path: |
            artifacts/*.xlsx
            artifacts/ui_*.png
            artifacts/layout-audit.json
            artifacts/field-sweep.json
          retention-days: 3

      - name: Package staging preview without publishing production
        if: github.ref == 'refs/heads/staging'
        run: |
          mkdir -p artifacts/staging-preview/src
          cp index.html favicon.svg fondo_original.png artifacts/staging-preview/
          cp -R src/. artifacts/staging-preview/src/
          test -f artifacts/staging-preview/src/app.js
          test ! -d artifacts/staging-preview/supabase
      - name: Upload QA-verified staging website artifact
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: totus-staging-site
          path: artifacts/staging-preview/
          retention-days: 7
