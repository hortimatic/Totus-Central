name: Totus Clean QA
on:
  workflow_call:
  pull_request:
    branches: [totus-central]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/qa.mjs
      - run: node tests/connection-maintenance-qa.mjs
      - run: node tests/backup-retention-qa.mjs
      - run: node tests/storage-planning-qa.mjs
      - run: node tests/closed-closing-qa.mjs
      - run: node tests/closing-workflow-qa.mjs
      - run: node tests/source-closing-qa.mjs
      - run: node tests/historical-acceptance-qa.mjs
      - run: node tests/income-breakdown-qa.mjs
      - run: node tests/payment-information-qa.mjs
      - run: node tests/tax-expense-qa.mjs
      - run: node tests/expense-reconciliation-qa.mjs
      - run: node tests/treasury-source-qa.mjs
      - run: node tests/partial-balances-qa.mjs
      - run: node tests/rectifying-refunds-qa.mjs
      - run: node tests/team-admin-qa.mjs
      - run: node tests/invoice-issuer-qa.mjs
      - run: node tests/gestor-source-qa.mjs
      - run: node tests/functional-regression.mjs
      - run: node tests/supplier-credit-qa.mjs
      - run: node tests/cross-view-integrity-qa.mjs
      - run: node tests/code-integrity.mjs
      - run: node tests/production-contract-qa.mjs
      - run: node tests/permissions-qa.mjs
      - run: node tests/roles-and-help-qa.mjs
      - run: node tests/route-smoke.mjs
      - run: node tests/action-inventory-qa.mjs
      - run: node tests/api-integrity-qa.mjs
      - run: node tests/onedrive-document-access-qa.mjs
      - run: node tests/onedrive-retired-documents-qa.mjs
      - run: node tests/document-retirement-qa.mjs
      - run: node tests/backup-part-retirement-qa.mjs
      - run: node tests/cloud-backup-retention-qa.mjs
      - run: node tests/direct-backup-transfer-qa.mjs
      - run: node tests/filters-qa.mjs
      - run: node tests/fiscal-forecast-qa.mjs
      - run: node tests/document-filter-size-qa.mjs
      - run: node tests/document-archive-qa.mjs
      - run: node tests/archive-documents-qa.mjs
      - run: node tests/expense-archive-qa.mjs
      - run: node tests/excel-invariants.mjs
      - run: npm install --no-save xlsx-js-style playwright jszip pdf-lib fflate@0.8.3
      - run: node tests/backup-transport-qa.mjs
      - run: node tests/partitioned-handler-qa.mjs
      - run: node tests/partitioned-backup-qa.mjs
      - run: node tests/recovery-core-qa.mjs
      - run: node tests/recovery-capacity-qa.mjs
      - run: node tests/native-backup-zip-qa.mjs
      - run: node tests/recovery-handler-qa.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/workbook-preview-qa.mjs
      - run: node tests/excel-qa.mjs
      - run: node tests/monthly-workbook-qa.mjs
      - run: node tests/source-workbook-qa.mjs
      - run: node tests/legacy-retention-qa.mjs
      - run: node tests/gestor-workbook-qa.mjs
      - run: node tests/gestor-print-qa.mjs
      - run: node tests/quarter-fixture-qa.mjs
      - run: node tests/annual-stress-qa.mjs
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/totus-http.log 2>&1 &
      - run: node tests/closing-workflow-browser-qa.mjs
      - run: node tests/tax-expense-browser-qa.mjs
      - run: node tests/expense-layout-qa.mjs
      - run: node tests/onedrive-connection-qa.mjs
      - run: node tests/storage-live-qa.mjs
      - run: node tests/storage-organization-qa.mjs
      - run: node tests/deletion-flows-qa.mjs
      - run: node tests/browser-qa.mjs
      - run: node tests/source-reconciliation-qa.mjs
      - run: node tests/store-reconciliation-qa.mjs
      - run: node tests/layout-audit.mjs
      - run: node tests/visual-geometry-qa.mjs
      - run: node tests/user-screenshot-qa.mjs
      - run: node tests/modal-geometry-qa.mjs
      - run: node tests/field-sweep-qa.mjs
      - run: node tests/live-refresh-qa.mjs
      - run: node tests/report-period-qa.mjs
      - run: node tests/second-review-qa.mjs
      - run: node tests/full-flow-qa.mjs
      - run: node tests/rectifying-browser-qa.mjs
      - run: node tests/pdf-preview-qa.mjs
      - run: node tests/invoice-logo-qa.mjs
      - run: node tests/partitioned-browser-qa.mjs
      - run: node tests/backup-qa.mjs
      - run: node tests/recovery-browser-qa.mjs
      - run: node tests/form-drafts-qa.mjs
      - run: node tests/attachment-integrity-qa.mjs
      - run: node tests/admin-submenus-qa.mjs
      - run: node tests/billing-submenus-qa.mjs
      - run: node tests/fiscal-submenus-qa.mjs
      - run: node tests/store-drawers-qa.mjs
      - run: node tests/mobile-navigation-qa.mjs
      - run: node tests/shell-geometry-qa.mjs
      - run: node tests/subtab-walk-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: totus-excel-qa
          path: |
            artifacts/*.xlsx
            artifacts/gestor_source_qa.pdf
            artifacts/gestor_source_qa.png
            artifacts/review_*.png
            artifacts/ui_*.png
            artifacts/layout_*.png
            artifacts/user_*.png
            artifacts/layout-audit.json
            artifacts/subtab-walk.json
            artifacts/user_screenshot_checks.json
            artifacts/field-sweep.json
          retention-days: 3
