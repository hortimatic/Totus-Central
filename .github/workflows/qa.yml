  stock-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated stock database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/stock-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023170949_stock_receipts_with_complete_backups.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023171258_stock_receipt_author_index.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023175147_bounded_backup_rehearsal_timeout.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261023223642_require_explicit_stock_reading_confirmation.sql
          # The isolated fixture does not install the complete recovery service; compare
          # all receipt columns and constraints (the inputs to production's schema hash).
          psql -h localhost -U postgres -At -v ON_ERROR_STOP=1 -c "SELECT md5((SELECT coalesce(string_agg(attname||':'||pg_catalog.format_type(atttypid,atttypmod)||':'||attnotnull,'|' ORDER BY attnum),'') FROM pg_catalog.pg_attribute WHERE attrelid='public.ops_stock_receipts'::regclass AND attnum>0 AND NOT attisdropped)||'/'||(SELECT coalesce(string_agg(conname||':'||pg_catalog.pg_get_constraintdef(oid),'|' ORDER BY conname),'') FROM pg_catalog.pg_constraint WHERE conrelid='public.ops_stock_receipts'::regclass))" > /tmp/stock_recovery_hash_before
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261028130000_stock_reviewed_with_justification.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261028164000_stock_manual_pairing_receipt_delete.sql
          psql -h localhost -U postgres -At -v ON_ERROR_STOP=1 -c "SELECT md5((SELECT coalesce(string_agg(attname||':'||pg_catalog.format_type(atttypid,atttypmod)||':'||attnotnull,'|' ORDER BY attnum),'') FROM pg_catalog.pg_attribute WHERE attrelid='public.ops_stock_receipts'::regclass AND attnum>0 AND NOT attisdropped)||'/'||(SELECT coalesce(string_agg(conname||':'||pg_catalog.pg_get_constraintdef(oid),'|' ORDER BY conname),'') FROM pg_catalog.pg_constraint WHERE conrelid='public.ops_stock_receipts'::regclass))" > /tmp/stock_recovery_hash_after
          cmp /tmp/stock_recovery_hash_before /tmp/stock_recovery_hash_after
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/stock-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/stock-db-backup-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/expense-report-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/expense-payment-color-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/common-expense-db-qa.sql

      - name: Verify isolated Pricing database
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h localhost -U postgres pricing_qa
          psql -h localhost -U postgres -d pricing_qa -v ON_ERROR_STOP=1 -f tests/pricing-db-fixture.sql
          psql -h localhost -U postgres -d pricing_qa -v ON_ERROR_STOP=1 -f supabase/migrations/20261024050000_atomic_pricing_product_drafts.sql
          psql -h localhost -U postgres -d pricing_qa -v ON_ERROR_STOP=1 -f tests/pricing-db-qa.sql
          psql -h localhost -U postgres -d pricing_qa -v ON_ERROR_STOP=1 -f supabase/review_patches/019_pricing_provider_retries.sql
          psql -h localhost -U postgres -d pricing_qa -v ON_ERROR_STOP=1 -f tests/pricing-provider-retries-db-qa.sql

  closing-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated closing database
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/closing-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261019120841_preserve_closing_income_selection_on_reconciliation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/020_closing_drafts_and_drawer_checks.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/closing-db-qa.sql
      - name: Verify Log cleanup in a disposable database
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h localhost -U postgres log_cleanup_qa
          psql -h localhost -U postgres -d log_cleanup_qa -v ON_ERROR_STOP=1 -f tests/log-cleanup-db-fixture.sql
          psql -h localhost -U postgres -d log_cleanup_qa -v ON_ERROR_STOP=1 -f supabase/review_patches/028_log_cleanup.sql
          psql -h localhost -U postgres -d log_cleanup_qa -v ON_ERROR_STOP=1 -f tests/log-cleanup-db-qa.sql

