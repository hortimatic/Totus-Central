name: Totus Clean QA
on:
  push:
    branches: [reconstruccion-limpia, main, auditoria-integral-2026-10-11]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/qa.mjs
      - run: node tests/functional-regression.mjs
      - run: npm install --no-save xlsx-js-style playwright jszip pdf-lib
      - run: npx playwright install --with-deps chromium
      - run: node tests/excel-qa.mjs
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/totus-http.log 2>&1 &
      - run: node tests/browser-qa.mjs
      - run: node tests/full-flow-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: totus-excel-qa
          path: |
            artifacts/*.xlsx
            artifacts/ui_*.png
          retention-days: 3
