          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/022_chat_channel_order.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/chat-advanced-db-qa.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/023_chat_channel_store.sql
