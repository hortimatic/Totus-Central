name: Totus Clean QA
on:
  workflow_call:
  pull_request:
    branches: [totus-central]
  workflow_dispatch:
jobs:
  appearance-element-colors-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated validator and roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA private; CREATE ROLE anon; CREATE ROLE authenticated;'
      - name: Load production-equivalent validator baseline
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/061_personal_navigation_layout.sql
      - name: Extend allowlist and verify repeatability
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/074_independent_interface_text_box_colors.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/074_independent_interface_text_box_colors.sql
      - name: Verify new colours, legacy validation and no privilege expansion
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/appearance-element-colors-db-qa.sql
  home-widgets-functional-browser:
    runs-on: ubuntu-24.04
    env:
      TOTUS_START_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Validate pure widget logic
        run: node tests/home-widgets-core-qa.mjs
      - name: Validate integration and layout with Playwright
        run: node tests/home-widgets-integration-browser-qa.mjs
      - name: Validate buttons, real filtering and navigation with Playwright
        run: node tests/home-widgets-actions-browser-qa.mjs
      - name: Validate touch drag and resize on mobile
        run: node tests/home-widgets-touch-browser-qa.mjs
      - name: Validate Mi interfaz themes and dashboard contrast
        run: node tests/home-widgets-appearance-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inicio-modular-vistas
          path: qa-artifacts/inicio/*.png
          if-no-files-found: ignore
  home-dashboard-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Inicio dashboard preferences in disposable PostgreSQL
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/home-dashboard-db-fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110162926_inicio_modular_personal_layout.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110162926_inicio_modular_personal_layout.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/home-dashboard-db-qa.sql
  prestashop-permissions-database:
    runs-on: ubuntu-latest
