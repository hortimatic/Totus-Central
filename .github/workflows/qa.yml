name: Totus Clean QA
on:
  push:
    branches: [reconstruccion-limpia]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/qa.mjs
      - run: npm install --no-save xlsx-js-style
      - run: node tests/excel-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: totus-excel-qa
          path: artifacts/*.xlsx
          retention-days: 3
