          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/review_patches/065_prestashop_order_alerts.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/prestashop-automations-db-qa.sql
